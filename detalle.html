<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detalle de Propiedad</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rethink+Sans:ital,wght@0,400..800;1,400..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="main-header header-static">
      <div class="container container-header">
        <!-- LOGOTIPO SVG PROFESIONAL INTEGRADO -->
        <a href="index.html" class="logo-personalizado">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 380 90"
            width="100%"
            height="100%"
          >
            <!-- Círculos decorativos más grandes -->
            <circle
              cx="45"
              cy="45"
              r="38"
              fill="none"
              stroke="#ffffff"
              stroke-width="2.2"
              opacity="0.35"
            />
            <circle
              cx="45"
              cy="45"
              r="30"
              fill="none"
              stroke="#ffffff"
              stroke-width="1.5"
              opacity="0.3"
            />

            <!-- Ícono elegante de casa centrado y proporcionado -->
            <path
              d="M45 22 L64 37 L57 37 L57 62 L33 62 L33 37 L26 37 Z"
              fill="none"
              stroke="#ffffff"
              stroke-width="4"
              stroke-linejoin="round"
            />
            <path
              d="M39 62 L39 50 L51 50 L51 62"
              fill="none"
              stroke="#ffffff"
              stroke-width="2.2"
            />

            <!-- Textos con mayor tamaño y legibilidad -->
            <text
              x="96"
              y="42"
              font-family="'Lexend', sans-serif"
              font-size="50"
              font-weight="700"
              fill="#ffffff"
              letter-spacing="0.5"
            >
              Esperanza
            </text>
            <text
              x="98"
              y="75"
              font-family="'Lexend', sans-serif"
              font-size="25"
              font-weight="500"
              fill="#ffffff"
              letter-spacing="6"
              opacity="0.9"
            >
              PROPIEDADES
            </text>
          </svg>
        </a>

        <div class="hamburger">
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </div>

        <nav class="main-nav">
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="arriendo-compra.html">Compra o Arrienda</a></li>
            <li><a href="venta.html">Vende o Arrienda</a></li>
            <li><a href="quiensoy.html">Quién Soy</a></li>
            <li><a href="terminos.html">Términos y Condiciones</a></li>
            <li><a href="#contacto">CONTACTO</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <!-- Sección de Detalle Elegante -->
    <main class="detalle-container container">
      <div class="detalle-grid">
        <!-- Columna Izquierda: Slider de Imágenes -->
        <div class="detalle-imagen-slider">
          <div class="slider-container">
            <!-- AQUí SE MODIFICÓ: alt vacío para que JS lo llene dinámicamente -->
            <img id="imagen-slider" src="" alt="" />

            <!-- Botones de flechas manuales -->
            <button id="sliderPrev" class="detalle-slider-btn prev-btn">
              <i class="fa-solid fa-chevron-left"></i>
            </button>
            <button id="sliderNext" class="detalle-slider-btn next-btn">
              <i class="fa-solid fa-chevron-right"></i>
            </button>

            <!-- Indicador numérico -->
            <div id="slider-counter" class="slider-counter">1 / 1</div>
          </div>
        </div>

        <!-- Columna Derecha: Información Estructurada -->
        <div class="detalle-info" id="detalle-contenido">
          <h1 id="titulo"></h1>
          <p id="descripcion" class="detalle-desc"></p>

          <!-- Ficha técnica con viñetas limpias -->
          <ul class="lista-caracteristicas">
            <li>
              <strong>Ubicación:</strong> <span id="det-ubicacion">-</span>
            </li>
            <li><strong>Piezas:</strong> <span id="det-piezas">-</span></li>
            <li><strong>Baños:</strong> <span id="det-banos">-</span></li>
            <li><strong>Patio:</strong> <span id="det-patio">-</span></li>
            <li>
              <strong>Estacionamiento:</strong>
              <span id="det-estacionamiento">-</span>
            </li>
          </ul>

          <!-- Caja de Valor Destacada -->
          <div class="detalle-precio-box">
            <span class="precio-label">Valor:</span>
            <span id="precio" class="precio-valor"></span>
          </div>

          <div class="detalle-botones">
            <a href="index.html" class="btn-primary">Volver al Inicio</a>
          </div>
        </div>
      </div>
    </main>

    <!-- Botón flotante de WhatsApp dinámico -->
    <a
      id="whatsapp-btn"
      href="https://wa.me/56992245912"
      class="whatsapp-float"
      target="_blank"
    >
      <i class="fa-brands fa-whatsapp"></i>
      <span class="whatsapp-text">Consultar</span>
    </a>

    <script src="detalle.js"></script>
    <script src="script.js"></script>
  </body>
</html>
